<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PoolFlow — Live Demo (Clearwater Pools)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { background: #0b1220; color: #e2e8f0; min-height: 100vh; }
  .gradient-bg { background: radial-gradient(circle at 30% 0%, #1e3a5f 0%, #0b1220 60%); }

  /* PHONE FRAME */
  .phone {
    width: 380px; height: 760px;
    background: #fff; color:#0b1220;
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 10px #1f2937, 0 0 0 12px #374151;
    overflow: hidden; position: relative; display: flex; flex-direction: column;
  }
  .notch { position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:120px; height:28px; background:#000; border-radius:20px; z-index:50; }
  .statusbar { padding: 18px 28px 6px; display:flex; justify-content:space-between;
    font-size:13px; font-weight:600; color:#0b1220; flex-shrink:0; }
  .phone-screen { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .phone-screen::-webkit-scrollbar { width: 0; }

  /* SMS */
  .sms-in { background:#e9e9eb; color:#000; border-radius: 18px 18px 18px 4px; padding:10px 14px; max-width:80%; }
  .sms-out { background:#34c759; color:#fff; border-radius: 18px 18px 4px 18px; padding:10px 14px; max-width:80%; }
  .wa-bubble { background:#dcf8c6; color:#000; border-radius: 12px; padding:10px 12px; }

  /* CARDS */
  .card { background:#fff; border-radius:16px; border:1px solid #eef0f4; }
  .pill { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600; }
  .photo { aspect-ratio:1; background-size:cover; background-position:center; border-radius:8px; position:relative; overflow:hidden; }
  .lead-card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:12px; cursor:pointer; transition:all .15s; }
  .lead-card:hover { border-color:#0ea5e9; box-shadow: 0 6px 20px -4px rgba(14,165,233,.25); transform: translateY(-2px); }
  .lead-card.new { border-color:#10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.15); animation: pulseNew 2s ease infinite; }
  @keyframes pulseNew { 0%,100% { box-shadow: 0 0 0 3px rgba(16,185,129,.15); } 50% { box-shadow: 0 0 0 8px rgba(16,185,129,.05); } }

  /* NAV */
  .nav-item { display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:10px; font-size:14px; font-weight:500; color:#475569; cursor:pointer; transition:all .15s; }
  .nav-item:hover { background:#f1f5f9; color:#0b1220; }
  .nav-item.active { background:#0891b2; color:#fff; box-shadow: 0 4px 14px -4px rgba(8,145,178,.5); }
  .nav-item.active:hover { background:#0e7490; color:#fff; }

  /* BUTTONS */
  .btn { padding:14px 16px; border-radius:14px; font-weight:600; transition:all .15s; cursor:pointer; }
  .btn:active { transform: scale(.98); }
  .btn-primary { background:#0891b2; color:#fff; }
  .btn-primary:hover { background:#0e7490; }
  .btn-success { background:#10b981; color:#fff; }
  .btn-success:hover { background:#059669; }
  .btn-warning { background:#f59e0b; color:#fff; }
  .btn-ghost { background:#f1f5f9; color:#0b1220; }

  /* TOAST */
  #toast { position:fixed; bottom:24px; left:50%; transform: translateX(-50%) translateY(100px);
    background:#10b981; color:#fff; padding:14px 22px; border-radius:14px; font-weight:600;
    box-shadow:0 10px 30px rgba(16,185,129,.4); transition: transform .3s; z-index:1000; }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* HOME */
  .role-card { background: rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:20px; padding:28px;
    cursor:pointer; transition: all .2s; }
  .role-card:hover { background: rgba(255,255,255,.08); border-color: #0891b2; transform: translateY(-2px); box-shadow: 0 10px 40px -10px rgba(8,145,178,.3); }

  /* FORM */
  .input { width:100%; border:2px solid #e2e8f0; border-radius:12px; padding:12px 14px; font-size:15px; transition:border-color .15s; }
  .input:focus { outline:none; border-color:#0891b2; }
  .chip-btn { padding:14px; border-radius:12px; border:2px solid #e2e8f0; background:#fff; cursor:pointer; transition:all .15s; text-align:left; }
  .chip-btn:hover { border-color:#0891b2; background:#f0fdfa; }
  .chip-btn.selected { border-color:#0891b2; background:#0891b2; color:#fff; }

  /* DEV TOOLBAR */
  #devbar { position:fixed; top:16px; right:16px; background: rgba(15,23,42,.9); backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:8px; z-index:100; display:flex; gap:6px; }
  .devbtn { padding: 7px 12px; font-size:12px; font-weight:600; color:#cbd5e1; border-radius:8px; cursor:pointer; transition:all .15s; }
  .devbtn:hover { background:rgba(255,255,255,.08); color:#fff; }
  .devbtn.active { background:#0891b2; color:#fff; }

  .anim-fade { animation: fade .35s ease; }
  @keyframes fade { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform:none;} }

  .ring { animation: ringpulse 1.2s infinite; }
  @keyframes ringpulse { 0%,100%{ transform: rotate(-8deg);} 50% { transform: rotate(8deg);} }

  .toggle { width:36px; height:20px; background:#e2e8f0; border-radius:999px; position:relative; cursor:pointer; transition:background .2s; }
  .toggle.on { background:#10b981; }
  .toggle::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; background:#fff; border-radius:999px; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .toggle.on::after { left:18px; }

  /* BAR CHART */
  .bar { background: linear-gradient(180deg, #06b6d4, #0e7490); border-radius: 6px 6px 0 0; transition:all .3s; }
  .bar:hover { background: linear-gradient(180deg, #22d3ee, #06b6d4); }

  /* FAKE PHOTO BACKGROUNDS */
  .photo-greenpool { background: linear-gradient(135deg, #84cc16, #166534); position:relative; }
  .photo-greenpool::after { content:'🌿'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:32px; opacity:.6; }
  .photo-cloudypool { background: linear-gradient(135deg, #94a3b8, #475569); position:relative; }
  .photo-cloudypool::after { content:'💧'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:32px; opacity:.6; }
  .photo-pump { background: linear-gradient(135deg, #64748b, #1e293b); position:relative; }
  .photo-pump::after { content:'⚙️'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:32px; opacity:.6; }
  .photo-equipment { background: linear-gradient(135deg, #06b6d4, #155e75); position:relative; }
  .photo-equipment::after { content:'🔧'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:32px; opacity:.6; }

  .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
</style>
</head>
<body>

<!-- DEV TOOLBAR -->
<div id="devbar">
  <div class="devbtn" onclick="go('home')">🏠 Home</div>
  <div class="devbtn" onclick="go('client/call')">📱 Customer</div>

const Store = {
  data: {},
  load() {
    const saved = localStorage.getItem('poolflow_v2');
    if (saved) { try { this.data = JSON.parse(saved); } catch { this.data = JSON.parse(JSON.stringify(INITIAL_STATE)); } }
    else { this.data = JSON.parse(JSON.stringify(INITIAL_STATE)); }
  },
  save() { localStorage.setItem('poolflow_v2', JSON.stringify(this.data)); },
  reset() { this.data = JSON.parse(JSON.stringify(INITIAL_STATE)); this.save(); }
};
Store.load();

function resetDemo() {
  if (confirm("Reset all demo data?")) {
    Store.reset();
    showToast("Demo reset ✓");
    go('home');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============================================================
   ROUTER
   ============================================================ */
function go(view) {
  window.location.hash = view;
  render();
}

window.addEventListener('hashchange', render);
window.addEventListener('load', render);

function render() {
  const route = window.location.hash.replace('#','') || 'home';
  const app = document.getElementById('app');
  app.innerHTML = '';

  // Update devbar active state
  document.querySelectorAll('#devbar .devbtn').forEach(b => b.classList.remove('active'));

  if (route === 'home') return renderHome(app);
  if (route.startsWith('client')) return renderClient(app, route);
  if (route.startsWith('tradie')) return renderTradie(app, route);
  if (route.startsWith('dashboard')) return renderDashboard(app, route);

  renderHome(app);
}

/* ============================================================
   VIEWS — HOME
   ============================================================ */

          <p class="text-slate-300 text-lg max-w-2xl mx-auto">
            Cette démo est <strong class="text-white">vraiment fonctionnelle</strong>. Remplis le formulaire côté client, switch côté tradie, valide le devis — les données circulent réellement entre les écrans.
          </p>
        </div>

        <div class="grid md:grid-cols-3 gap-5 anim-fade">

            <div class="text-4xl mb-3">📱</div>
            <div class="text-xs font-bold text-pink-300 uppercase mb-1">Path 1</div>
            <div class="text-xl font-bold mb-2">Customer (Emma)</div>
            <p class="text-sm text-slate-400 mb-4">Une cliente avec une piscine verte appelle Clearwater Pools. Suis tout son parcours : appel manqué, SMS, formulaire, devis reçu, paiement.</p>
            <div class="text-xs text-cyan-300 font-semibold">Démarrer le parcours client →</div>
          </div>

          <div class="role-card" onclick="go('tradie/inbox')">
            <div class="text-4xl mb-3">🔧</div>
            <div class="text-xs font-bold text-emerald-300 uppercase mb-1">Path 2</div>
            <div class="text-xl font-bold mb-2">Tradie phone (Dave)</div>
            <p class="text-sm text-slate-400 mb-4">Vue mobile pour Dave (le pool guy). Reçoit des leads en temps réel, ouvre le dossier, ajuste le devis, l'IA apprend.</p>

/* ============================================================
   PHONE FRAME COMPONENT
   ============================================================ */
function phoneFrame(label, color, screen) {
  return `
    <div class="min-h-screen gradient-bg flex flex-col items-center justify-center py-10 px-4 anim-fade">
      <div class="mb-4">
        <div class="pill ${color === 'pink' ? 'bg-pink-500/20 text-pink-300' : 'bg-emerald-500/20 text-emerald-300'}">${label}</div>
      </div>
      <div class="phone">
        <div class="notch"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span>📶 5G  100%</span>
        </div>
        <div class="phone-screen">${screen}</div>
      </div>
      <div class="mt-6 text-xs text-slate-400">
        Use the dev toolbar at the top right to switch views ↗
      </div>
    </div>
  `;
}

/* ============================================================
   VIEWS — CLIENT (Emma)
   ============================================================ */
function renderClient(app, route) {
  const sub = route.split('/')[1] || 'call';
  const status = Store.data.newLeadStatus;

  // Auto-redirect based on state
  if (sub === 'thanks' && status === 'quoted') return goNoRender('client/quote-received');

  const screens = {
    'call': clientCallScreen,
    'sms': clientSmsScreen,
    'form': clientFormScreen,
    'thanks': clientThanksScreen,
    'quote-received': clientQuoteReceivedScreen,
    'payment': clientPaymentScreen,
    'paid': clientPaidScreen
  };

  const screen = (screens[sub] || clientCallScreen)();
  app.innerHTML = phoneFrame('📱 EMMA — la cliente', 'pink', screen);
}

function goNoRender(view) { window.location.hash = view; }

function clientCallScreen() {
  // Show timer counting up
  setTimeout(() => {
    const t = document.getElementById('call-timer');
    let s = 0;
    if (t) {
      const id = setInterval(() => {
        s++;
        if (t) t.textContent = `0:${s.toString().padStart(2,'0')}`;
        else clearInterval(id);
        if (s >= 28) clearInterval(id);
      }, 1000);
    }
  }, 100);

  return `
    <div class="text-center pt-16 px-6">
      <div class="text-7xl mb-5 ring inline-block">📞</div>
      <div class="text-2xl font-bold mb-1">Clearwater Pools</div>
      <div class="text-sm text-slate-500 mb-1">Gold Coast • +61 7 5555 0188</div>
      <div id="call-timer" class="text-sm text-slate-400 mt-4 font-mono">0:00</div>

      <div class="mt-12 mx-3 bg-rose-50 rounded-2xl p-4 text-sm text-rose-700 text-left">
        <div class="font-semibold mb-1">📵 Pas de réponse</div>
        <div class="text-xs leading-relaxed">
          Emma a une piscine verte depuis 3 jours. Elle stresse. Dave est sur un autre client à Burleigh, son tél est en silencieux.
        </div>
      </div>

      <button class="btn btn-primary w-full mt-6" onclick="simulateMissedCall()">
        ⏭ Simulate missed call (skip wait)
      </button>
    </div>
  `;
}

function simulateMissedCall() {
  Store.data.smsThread = [
    { from: 'business', text: `Hey, Dave from Clearwater Pools 👋 Sorry I missed your call — I'm out at a job. Reply <strong>YES</strong> and I'll send you a quick form (60 sec) so I can come back to you with a quote and time slot. Cheers!`, time: 'Just now' }
  ];
  Store.save();
  showToast("Auto-SMS sent in 30 seconds ⚡");
  go('client/sms');
}

function clientSmsScreen() {
  const thread = Store.data.smsThread || [];
  const messagesHtml = thread.map(m => {
    if (m.from === 'business') {
      return `<div><div class="sms-in">${m.text}</div><div class="text-[10px] text-slate-400 mt-1">${m.time}</div></div>`;
    } else {
      return `<div class="flex justify-end"><div><div class="sms-out">${m.text}</div><div class="text-[10px] text-slate-400 mt-1 text-right">${m.time}</div></div></div>`;
    }
  }).join('');

  const userReplied = thread.some(m => m.from === 'user');
  const linkSent = thread.some(m => m.from === 'business' && m.text.includes('poolflow.app'));

  let actionButtons = '';
  if (!userReplied) {
    actionButtons = `
      <div class="border-t border-slate-200 p-3 bg-white">
        <div class="text-xs text-slate-400 mb-2 text-center">Quick reply</div>
        <div class="flex gap-2">
          <button class="flex-1 btn btn-success" onclick="replyYes()">Reply YES</button>
          <button class="flex-1 btn btn-ghost" onclick="alert('Demo path: reply YES to continue')">No thanks</button>
        </div>
      </div>
    `;
  } else if (linkSent) {
    actionButtons = `
      <div class="border-t border-slate-200 p-3 bg-white">
        <button class="btn btn-primary w-full" onclick="go('client/form')">📝 Open the form (poolflow.app/r/aB3xK9)</button>

function formNext(currentStep) {
  if (currentStep === 1) {
    const v = document.getElementById('f-address').value;
    if (!v) { showToast("Address required"); return; }
    Store.data.newLeadDraft.address = v;
    // Extract suburb (after last comma)
    const parts = v.split(',');
    Store.data.newLeadDraft.suburb = parts.length > 1 ? parts[1].trim().split(' ')[0] : v;
  }
  if (currentStep === 2) {
    if (!Store.data.newLeadDraft.issue_type) { showToast("Pick an issue"); return; }
  }
  if (currentStep === 3) {
    Store.data.newLeadDraft.description = document.getElementById('f-desc').value;
  }
  Store.data.formStep = currentStep + 1;
  Store.save();
  render();
}

function selectIssue(id, label) {
  Store.data.newLeadDraft.issue_type = id;
  Store.data.newLeadDraft.issue_label = label;
  Store.save();
  render();
}

function addPhoto(idx) {
  const photoTypes = ['greenpool', 'cloudypool', 'pump', 'equipment'];
  const issueType = Store.data.newLeadDraft.issue_type;
  let photo = 'greenpool';
  if (issueType === 'green') photo = 'greenpool';
  else if (issueType === 'cloudy') photo = 'cloudypool';
  else if (issueType === 'pump') photo = 'pump';
  else photo = 'equipment';

  if (!Store.data.newLeadDraft.photos) Store.data.newLeadDraft.photos = [];
  Store.data.newLeadDraft.photos[idx] = photo;
  Store.save();
  render();
  showToast("Photo uploaded ✓");
}

function selectUrgency(u) {
  Store.data.newLeadDraft.urgency = u;
  Store.save();
  render();
}

function toggleAvail(slot) {
  const a = Store.data.newLeadDraft.availability || [];
  const i = a.indexOf(slot);
  if (i >= 0) a.splice(i, 1);
  else a.push(slot);
  Store.data.newLeadDraft.availability = a;
  Store.save();
  render();
}

function submitForm() {
  const draft = Store.data.newLeadDraft;
  if (!draft.urgency) { showToast("Pick urgency"); return; }
  if (!draft.availability || draft.availability.length === 0) { showToast("Pick at least one time slot"); return; }

  // Generate AI quote based on issue type
  let aiQuote = 480;
  let confidence = 85;
  let breakdown = [];

  if (draft.issue_type === 'green') {
    aiQuote = 480;
    confidence = 87;
    breakdown = [
      { label: 'Initial visit + chemical shock', amount: 280 },
      { label: 'Follow-up visit (3 days later)', amount: 120 },
      { label: 'Final balance check', amount: 80 }
    ];
  } else if (draft.issue_type === 'cloudy') {
    aiQuote = 220;
    confidence = 82;
    breakdown = [
      { label: 'Callout', amount: 65 },
      { label: 'Filter clean + chemical balance', amount: 95 },
      { label: 'Clarifier + algaecide', amount: 60 }
    ];
  } else if (draft.issue_type === 'pump') {
    aiQuote = 380;
    confidence = 75;
    breakdown = [
      { label: 'Diagnostic callout', amount: 95 },
      { label: 'Likely bearing replacement', amount: 285 }
    ];
  } else if (draft.issue_type === 'salt') {
    aiQuote = 620;
    confidence = 90;
    breakdown = [
      { label: 'Hayward salt cell (your supplier price)', amount: 385 },
      { label: 'Labor 45min', amount: 95 },
      { label: 'Calibration + chemical balance', amount: 140 }
    ];
  } else if (draft.issue_type === 'equip') {
    aiQuote = 350;
    confidence = 70;
    breakdown = [
      { label: 'Diagnostic + initial labor', amount: 200 },
      { label: 'Estimated parts (TBC on site)', amount: 150 }
    ];
  } else {
    aiQuote = 280;
    confidence = 65;
    breakdown = [
      { label: 'Callout', amount: 65 },
      { label: 'Estimated 2h labor', amount: 190 },
      { label: 'Misc supplies', amount: 25 }
    ];
  }

  Store.data.newLeadStatus = 'submitted';
  Store.data.newLeadQuote = { aiQuote, confidence, breakdown };
  Store.data.formStep = 1;
  Store.save();

  showToast("✅ Submitted! Dave is notified.");
  setTimeout(() => go('client/thanks'), 800);
}
