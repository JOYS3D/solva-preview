<style>
:root {
  --bg: #FAFCFE; --surface: #FFFFFF; --surface-2: #F0F5F9; --surface-3: #E1ECF4;
  --border: #E4ECF2; --border-2: #C9DCE9;
  --text: #0A1929; --muted: #5B7587; --dim: #92A8B7;
  --of-blue: #00AFF0; --of-light: #5BC9F4; --of-dark: #0090CF; --of-shadow: rgba(0,175,240,.25);
  --accent: #00AFF0; --accent-2: #5BC9F4; --accent-3: #0090CF; --accent-shadow: rgba(0,175,240,.25);
  --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --info: #6366f1; --pink: #ec4899; --gold: #d4af37;
  --head-font: 'Inter', system-ui, sans-serif;
  --sidebar-w: 252px;
}
body.theme-dark {
  --bg: #0A1929; --surface: #112233; --surface-2: #1A2E42; --surface-3: #243E58;
  --border: #1F3650; --border-2: #2A4A65;
  --text: #F0F5F9; --muted: #92A8B7; --dim: #5B7587;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html, body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: var(--bg); color: var(--text); min-height: 100vh; transition: background .25s, color .25s; }
.serif { font-family: 'Playfair Display', Georgia, serif; letter-spacing: -0.02em; }
.mono { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; }

/* LAYOUT */
.layout { display: flex; min-height: 100vh; }
.sidebar { width: var(--sidebar-w); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); position: fixed; top: 0; bottom: 0; left: 0; overflow-y: auto; z-index: 50; display: flex; flex-direction: column; }
.sidebar::-webkit-scrollbar { width: 6px; } .sidebar::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 999px; }
.main { flex: 1; margin-left: var(--sidebar-w); padding: 0; min-height: 100vh; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; position: sticky; top: 0; z-index: 30; backdrop-filter: blur(10px); }
.content { padding: 28px; }

/* SIDEBAR */
.sb-logo { padding: 22px 20px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.sb-logo-icon { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, var(--of-blue), var(--of-dark)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 18px; }
.sb-logo-text { font-size: 15px; font-weight: 800; line-height: 1.1; }
.sb-logo-sub { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.sb-nav { flex: 1; padding: 14px 12px; }
.sb-section { padding: 14px 12px 6px; font-size: 10px; font-weight: 800; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; }
.sb-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; transition: all .12s; margin-bottom: 2px; }
.sb-item:hover { background: var(--surface-2); color: var(--text); }
.sb-item.active { background: var(--of-blue); color: #fff; font-weight: 600; box-shadow: 0 4px 12px -3px var(--of-shadow); }
.sb-item-icon { font-size: 15px; width: 20px; text-align: center; }
.sb-item-badge { margin-left: auto; font-size: 10px; padding: 2px 7px; border-radius: 999px; background: var(--surface-3); color: var(--text); font-weight: 700; }
.sb-item.active .sb-item-badge { background: rgba(255,255,255,.22); color: #fff; }
.sb-user { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.sb-user-avatar { width: 36px; height: 36px; border-radius: 999px; background: linear-gradient(135deg, var(--of-blue), var(--pink)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 14px; }
.sb-user-name { font-size: 13px; font-weight: 700; }
.sb-user-sub { font-size: 10px; color: var(--muted); }

/* TOPBAR */
.tb-bread { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.tb-bread strong { color: var(--text); font-weight: 700; }
.tb-actions { display: flex; align-items: center; gap: 8px; }
.tb-mode-toggle { display: flex; background: var(--surface-2); border-radius: 9px; padding: 3px; }
.tb-mode-btn { padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--muted); border: none; background: transparent; cursor: pointer; border-radius: 7px; transition: all .12s; }
.tb-mode-btn.active { background: var(--of-blue); color: #fff; box-shadow: 0 2px 8px -2px var(--of-shadow); }
.tb-theme-btn { width: 36px; height: 36px; border-radius: 9px; background: var(--surface-2); border: none; cursor: pointer; font-size: 16px; color: var(--text); }
.tb-theme-btn:hover { background: var(--surface-3); }

/* CARDS */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; transition: all .15s; }
.card-elev { background: var(--surface-2); }
.card-accent { background: linear-gradient(135deg, rgba(0,175,240,.08), rgba(0,144,207,.03)); border-color: rgba(0,175,240,.25); }
.card-hover:hover { border-color: var(--of-blue); transform: translateY(-1px); box-shadow: 0 10px 24px -10px var(--of-shadow); cursor: pointer; }
.card-pad { padding: 20px; }

/* KPI BIG */
.kpi-big { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; cursor: pointer; transition: all .15s; position: relative; overflow: hidden; }
.kpi-big:hover { border-color: var(--of-blue); transform: translateY(-2px); box-shadow: 0 14px 30px -10px var(--of-shadow); }
.kpi-big::before { content:''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--of-blue); }
.kpi-big.green::before { background: var(--success); }
.kpi-big.red::before { background: var(--danger); }
.kpi-big.gold::before { background: var(--gold); }
.kpi-big.pink::before { background: var(--pink); }
.kpi-lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
.kpi-val { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.kpi-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
.kpi-delta { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; margin-top: 8px; }
.kpi-delta.up { background: rgba(16,185,129,.15); color: var(--success); }
.kpi-delta.down { background: rgba(239,68,68,.15); color: var(--danger); }

/* PILLS */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.pill-success { background: rgba(16,185,129,.15); color: var(--success); }
.pill-warning { background: rgba(245,158,11,.18); color: #b45309; }
.pill-danger { background: rgba(239,68,68,.15); color: var(--danger); }
.pill-info { background: rgba(99,102,241,.15); color: var(--info); }
.pill-neutral { background: var(--surface-3); color: var(--muted); }
.pill-of { background: rgba(0,175,240,.15); color: var(--of-blue); }
.pill-hot { background: linear-gradient(135deg, #ef4444, #f97316); color: #fff; }
.pill-gold { background: rgba(212,175,55,.18); color: #b45309; }
.pill-pink { background: rgba(236,72,153,.15); color: var(--pink); }

/* BUTTONS */
.btn { padding: 9px 16px; border-radius: 10px; font-weight: 600; transition: all .12s; cursor: pointer; font-size: 13px; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; font-family: inherit; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--of-blue); color: #fff; }
.btn-primary:hover { background: var(--of-dark); }
.btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface-3); }
.btn-success { background: var(--success); color: #fff; }
.btn-warning { background: var(--warning); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-pink { background: var(--pink); color: #fff; }

/* INPUTS */
.input { width: 100%; border: 1px solid var(--border); border-radius: 9px; padding: 9px 13px; font-size: 13px; transition: border-color .12s; background: var(--surface); color: var(--text); font-family: inherit; }
.input:focus { outline: none; border-color: var(--of-blue); box-shadow: 0 0 0 3px var(--of-shadow); }

/* TABLE */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 10px 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; font-size: 10px; letter-spacing: .07em; border-bottom: 1px solid var(--border); }
td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:hover td { background: var(--surface-2); }
tr.clickable { cursor: pointer; }

/* AVATAR */
.avatar { width: 38px; height: 38px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 14px; flex-shrink: 0; }
.avatar-sm { width: 28px; height: 28px; font-size: 11px; }
.avatar-lg { width: 56px; height: 56px; font-size: 19px; }

/* PLATFORM ICONS */
.plat-icon { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 6px; font-size: 12px; font-weight: 800; color: #fff; }
.plat-of { background: var(--of-blue); }
.plat-ig { background: linear-gradient(135deg, #fdb913, #ed135b, #962fbf); }
.plat-tt { background: linear-gradient(135deg, #000, #25f4ee, #fe2c55); }
.plat-x { background: #000; }
.plat-tinder { background: linear-gradient(135deg, #fe6c5a, #ff655b); }
.plat-snap { background: #fffc00; color: #000; }
.plat-reddit { background: #ff4500; }
.plat-fb { background: #1877f2; }

/* AI suggestion bar */
.ai-bar { background: linear-gradient(135deg, rgba(0,175,240,.08), rgba(236,72,153,.05)); border: 1px solid var(--of-blue); border-radius: 14px; padding: 18px; display: flex; align-items: flex-start; gap: 14px; }
.ai-avatar { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, var(--of-blue), var(--pink)); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 19px; flex-shrink: 0; }

/* TOAST */
#toast { position: fixed; bottom: 24px; left: calc(50% + var(--sidebar-w)/2); transform: translateX(-50%) translateY(120px); background: var(--success); color: #fff; padding: 14px 22px; border-radius: 12px; font-weight: 600; box-shadow: 0 10px 30px rgba(16,185,129,.35); transition: transform .28s; z-index: 1000; max-width: 480px; }
#toast.show { transform: translateX(-50%) translateY(0); }

/* MODAL */
#modal:not(:empty) { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10,25,41,.7); backdrop-filter: blur(8px); }
.modal-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; }

/* ANIMS */
.anim-fade { animation: fade .3s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.anim-slide { animation: slide .35s ease; }
@keyframes slide { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }

/* BAR CHART */
.bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
.bar { flex: 1; background: linear-gradient(180deg, var(--of-light), var(--of-blue)); border-radius: 6px 6px 0 0; transition: all .25s; min-height: 6px; cursor: pointer; }
.bar:hover { opacity: .85; transform: scaleY(1.02); transform-origin: bottom; }
.bar-lbl { font-size: 10px; color: var(--muted); text-align: center; margin-top: 4px; }

/* DONUT (svg) */
.donut-wrap { position: relative; width: 140px; height: 140px; }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.donut-val { font-size: 22px; font-weight: 800; }
.donut-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; }

/* WORLD MAP */
.map-wrap { position: relative; width: 100%; height: 320px; background: var(--surface-2); border-radius: 12px; overflow: hidden; }
.map-zone { position: absolute; border-radius: 999px; background: rgba(0,175,240,.18); border: 2px solid var(--of-blue); transform: translate(-50%, -50%); cursor: pointer; transition: all .15s; }
.map-zone:hover { background: rgba(0,175,240,.35); }
.map-zone-hot { background: rgba(239,68,68,.22); border-color: var(--danger); animation: pulseHot 2s infinite; }
@keyframes pulseHot { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.4);} 50% { box-shadow: 0 0 0 12px rgba(239,68,68,0);} }

/* HEALTH SCORE */
.health-ring { width: 50px; height: 50px; position: relative; flex-shrink: 0; }

/* RESPONSIVE */
@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); transition: transform .2s; }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .content { padding: 16px; }
  #toast { left: 50%; }
}

/* SCROLLBAR */
.scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
.scrollbar-thin::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 999px; }
.scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
</style>
</head>

function $(s, p) { return (p||document).querySelector(s); }
function $$(s, p) { return Array.from((p||document).querySelectorAll(s)); }
function fmt(n) { return n.toLocaleString('fr-FR'); }
function moneyEU(n) { return Math.round(n).toLocaleString('fr-FR') + ' €'; }
function moneyUSD(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
function toast(msg, dur) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur || 2400);
}

function init() {
  const saved = localStorage.getItem('Northline_theme');
  if (saved) STATE.theme = saved;
  setTheme(STATE.theme);
  renderSidebar();
  go('home');
}
function setTheme(t) {
  STATE.theme = t;
  document.body.classList.remove('theme-light','theme-dark');
  document.body.classList.add('theme-' + t);
  localStorage.setItem('Northline_theme', t);
  document.getElementById('tb-theme').textContent = t === 'light' ? '🌙' : '☀️';
}
function toggleTheme() { setTheme(STATE.theme === 'light' ? 'dark' : 'light'); }
function setMode(m) {
  STATE.mode = m;
  document.getElementById('tb-Northline').classList.toggle('active', m === 'Northline');
  document.getElementById('tb-agencyos').classList.toggle('active', m === 'agencyos');
