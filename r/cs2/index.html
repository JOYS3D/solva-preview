document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Fictional names<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- WHAT WE BUILD -->\n<section data-screen-label=\"What we build\" style=\"background:var(--sunk); border-top:1px solid var(--line-2); border-bottom:1px solid var(--line-2);\">\n  <div style=\"max-width:1220px; margin:0 auto; padding:clamp(64px,8vw,120px) clamp(18px,3.5vw,36px);\">\n    <div data-rv=\"\" style=\"max-width:760px; margin-bottom:40px;\">\n      <p style=\"margin:0 0 18px; font-size:12.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3);\">What it usually is<\u002Fp>\n      <h2 style=\"margin:0; font-size:clamp(2rem,4vw,3.4rem); line-height:1.02; letter-spacing:-.045em; font-weight:600; text-wrap:balance;\">Five kinds of tool.<br><span style=\"color:var(--ink-3);\">One rule: it has to fit you.<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div data-rvs=\"\" style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%,220px), 1fr)); gap:12px;\">\n      <div style=\"padding:24px 22px; background:var(--surface); border:1px solid var(--line); border-radius:18px;\"><b style=\"display:block; font-size:18px; letter-spacing:-.025em; margin-bottom:8px;\">Operations dashboard<\u002Fb><p style=\"margin:0; font-size:14.5px; line-height:1.5; color:var(--ink-2);\">Today's jobs, who's where, what came in overnight. One screen at 7am.<\u002Fp><\u002Fdiv>\n      <div style=\"padding:24px 22px; background:var(--surface); border:1px solid var(--line); border-radius:18px;\"><b style=\"display:block; font-size:18px; letter-spacing:-.025em; margin-bottom:8px;\">Quote generator<\u002Fb><p style=\"margin:0; font-size:14.5px; line-height:1.5; color:var(--ink-2);\">Your prices, your margins, your wording. Out the door in minutes, not evenings.<\u002Fp><\u002Fdiv>\n      <div style=\"padding:24px 22px; background:var(--surface); border:1px solid var(--line); border-radius:18px;\"><b style=\"display:block; font-size:18px; letter-spacing:-.025em; margin-bottom:8px;\">Job management<\u002Fb><p style=\"margin:0; font-size:14.5px; line-height:1.5; color:var(--ink-2);\">From first call to paid invoice, with every status visible to whoever needs it.<\u002Fp><\u002Fdiv>\n      <div style=\"padding:24px 22px; background:var(--surface); border:1px solid var(--line); border-radius:18px;\"><b style=\"display:block; font-size:18px; letter-spacing:-.025em; margin-bottom:8px;\">Client portal<\u002Fb><p style=\"margin:0; font-size:14.5px; line-height:1.5; color:var(--ink-2);\">Customers see progress themselves. The \"any update?\" calls stop.<\u002Fp><\u002Fdiv>\n      <div style=\"padding:24px 22px; background:var(--surface); border:1px solid var(--line); border-radius:18px;\"><b style=\"display:block; font-size:18px; letter-spacing:-.025em; margin-bottom:8px;\">Booking platform<\u002Fb><p style=\"margin:0; font-size:14.5px; line-height:1.5; color:var(--ink-2);\">Live availability, deposits, reminders. Connected to Solva Call if you want it.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PROCESS -->\n<section data-screen-label=\"Process\" style=\"max-width:1220px; margin:0 auto; padding:clamp(64px,8vw,120px) clamp(18px,3.5vw,36px); display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%,320px), 1fr)); gap:clamp(32px,5vw,72px); align-items:start;\">\n  <div data-rv=\"\">\n    <p style=\"margin:0 0 18px; font-size:12.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--co);\">How it goes<\u002Fp>\n    <h2 style=\"margin:0 0 18px; font-size:clamp(2rem,4vw,3.4rem); line-height:1.02; letter-spacing:-.045em; font-weight:600; text-wrap:balance;\">You click it before we build it.<\u002Fh2>\n    <p style=\"margin:0; font-size:16.5px; line-height:1.55; color:var(--ink-2); max-width:40ch; text-wrap:pretty;\">We don't price work we haven't looked at, and we don't write code you haven't seen. Fixed price, agreed before we start.<\u002Fp>\n  <\u002Fdiv>\n  <div data-rvs=\"\" style=\"display:flex; flex-direction:column; gap:10px;\">\n    <div style=\"display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:16px; align-items:center; padding:20px 22px; background:var(--surface); border:1px solid var(--line); border-radius:18px;\"><span style=\"width:40px; height:40px; border-radius:12px; background:var(--co-bg); color:var(--co); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;\">1<\u002Fspan><span><b style=\"display:block; font-size:17px; letter-spacing:-.02em;\">The Walkthrough<\u002Fb><span style=\"font-size:14.5px; color:var(--ink-2);\">We follow one real job from first contact to paid invoice and note every place it stops or gets retyped.<\u002Fspan><\u002Fspan><span style=\"font-size:14px; font-weight:600; white-space:nowrap;\">$450, credited<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:16px; align-items:center; padding:20px 22px; background:var(--surface); border:1px solid var(--line); border-radius:18px;\"><span style=\"width:40px; height:40px; border-radius:12px; background:var(--co-bg); color:var(--co); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;\">2<\u002Fspan><span><b style=\"display:block; font-size:17px; letter-spacing:-.02em;\">A clickable prototype<\u002Fb><span style=\"font-size:14.5px; color:var(--ink-2);\">You use it on your phone before a line of real code exists. Change anything.<\u002Fspan><\u002Fspan><span style=\"font-size:14px; font-weight:600; white-space:nowrap;\">Included<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:16px; align-items:center; padding:20px 22px; background:var(--surface); border:1px solid var(--co); border-radius:18px;\"><span style=\"width:40px; height:40px; border-radius:12px; background:var(--co); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;\">3<\u002Fspan><span><b style=\"display:block; font-size:17px; letter-spacing:-.02em;\">Build, hand over, support<\u002Fb><span style=\"font-size:14.5px; color:var(--ink-2);\">Code, data and accounts in your name. A person to ring afterwards, if you want one.<\u002Fspan><\u002Fspan><span style=\"font-size:14px; font-weight:600; white-space:nowrap;\">2–6 weeks<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- GALLERY -->\n<section id=\"gallery\" data-screen-label=\"Demos\" style=\"background:var(--sunk); border-top:1px solid var(--line-2); border-bottom:1px solid var(--line-2); scroll-margin-top:66px;\">\n  <div style=\"max-width:1220px; margin:0 auto; padding:clamp(64px,8vw,120px) clamp(18px,3.5vw,36px);\">\n    <div data-rv=\"\" style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%,320px), 1fr)); gap:20px 48px; align-items:end; margin-bottom:40px;\">\n      <h2 style=\"margin:0; font-size:clamp(2rem,4vw,3.4rem); line-height:1.02; letter-spacing:-.045em; font-weight:600; text-wrap:balance;\">Don't take our word for it.<br><span style=\"color:var(--ink-3);\">Open one.<\u002Fspan><\u002Fh2>\n      <p style=\"margin:0; font-size:16.5px; color:var(--ink-2); max-width:42ch;\">Eight working demonstrations. Each one is the kind of tool a business like yours has asked for.<\u002Fp>\n    <\u002Fdiv>\n    <div data-rv=\"\">\n      <dc-import name=\"DemoGallery\" hint-size=\"100%,900px\"><\u002Fdc-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CTA -->\n<section id=\"talk\" data-screen-label=\"Final CTA\" style=\"background:var(--deep); color:var(--deep-ink); scroll-margin-top:66px;\">\n  <div style=\"max-width:1220px; margin:0 auto; padding:clamp(72px,9vw,130px) clamp(18px,3.5vw,36px); display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%,320px), 1fr)); gap:40px; align-items:end;\">\n    <h2 data-rv=\"\" style=\"margin:0; font-size:clamp(2.2rem,5vw,4.4rem); line-height:.98; letter-spacing:-.05em; font-weight:600; text-wrap:balance;\">Show us how the work happens today.<\u002Fh2>\n    <div data-rvs=\"\" style=\"display:flex; flex-direction:column; gap:16px; align-items:flex-start;\">\n      <p style=\"margin:0; font-size:17px; line-height:1.5; color:var(--deep-ink-2); max-width:38ch;\">That's the whole first conversation. No brief needed, no jargon. You'll speak to Yanis.<\u002Fp>\n      <a href=\"{{ ctaHref }}\" data-lift=\"\" style=\"display:inline-flex; align-items:center; min-height:54px; padding:0 28px; border-radius:12px; background:var(--deep-co); color:#fff; font-size:17px; font-weight:600;\">Call 0485 066 424<\u002Fa>\n      <sc-if value=\"{{ contactPending }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:6px 0 0; padding:10px 14px; border:1px dashed var(--deep-co); border-radius:10px; font-size:13px; color:var(--deep-ink-2);\">Contact channel to be confirmed before launch. Set it in Tweaks.<\u002Fp>\n      <\u002Fsc-if>\n      <p style=\"margin:6px 0 0; font-size:13.5px; color:var(--deep-ink-3);\">{{ geoMeta }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n\n<footer style=\"background:var(--deep); color:var(--deep-ink-2); border-top:1px solid var(--deep-line);\">\n  <div style=\"max-width:1220px; margin:0 auto; padding:30px clamp(18px,3.5vw,36px); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:18px;\">\n    <a href=\"SOLVA.dc.html\" style=\"font-weight:700; font-size:20px; letter-spacing:-.045em; color:var(--deep-ink);\">Solva<span style=\"color:var(--deep-co);\">.<\u002Fspan><\u002Fa>\n    <nav aria-label=\"Footer\" style=\"display:flex; gap:22px; font-size:14px; flex-wrap:wrap;\"><a href=\"SolvaCall.dc.html\" style=\"color:inherit;\">Solva Call<\u002Fa><a href=\"CustomSoftware.dc.html\" style=\"color:inherit;\">Custom software<\u002Fa><a href=\"SOLVA.dc.html#websites\" style=\"color:inherit;\">Websites<\u002Fa><a href=\"SOLVA.dc.html#work\" style=\"color:inherit;\">Work<\u002Fa><a href=\"#talk\" style=\"color:inherit;\">Call 0485 066 424<\u002Fa><\u002Fnav>\n    <p style=\"margin:0; font-size:13px; color:var(--deep-ink-3);\">© 2026 Solva · {{ geoFooter }}<\u002Fp>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;contactEmail&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Contact&quot;}, &quot;bookingUrl&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;tel:+61485066424&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Contact&quot;}, &quot;theme&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;auto&quot;, &quot;light&quot;, &quot;dark&quot;], &quot;default&quot;: &quot;auto&quot;, &quot;tsType&quot;: &quot;&#x27;auto&#x27; | &#x27;light&#x27; | &#x27;dark&#x27;&quot;, &quot;section&quot;: &quot;Appearance&quot;}}\">\nconst GEO = { meta:'Brisbane, Australia · In-person meetings available', footer:'Brisbane, Australia' };\nconst JOBS = [\n  ['07:00', 'Hot water · Nerang', 'D. Whelan · booked by Solva Call overnight', 'Booked', 'ok'],\n  ['09:30', 'Blocked drain · Carina', 'R. Ortiz · crew 2', 'On site', 'co'],\n  ['11:00', 'Tap replacement · Ascot', 'J. Hinds · quote sent Friday', 'Quoted', 'warm'],\n  ['13:30', 'Gas fitting · Kedron', 'A. Mayer · parts collected', 'Booked', 'ok'],\n];\nconst PILL = { co:['var(--co-bg)', 'var(--co)'], ok:['var(--ok-bg)', 'var(--ok)'], warm:['var(--warm-bg)', 'var(--warm)'], ink:['var(--sunk)', 'var(--ink-2)'] };\nconst STATUS = ['Loading your morning…', 'Four enquiries arrived overnight. All four already sorted.', 'Ascot just accepted the quote. Nobody chased it.', 'Week to date updated itself.', 'Nobody opened a laptop.'];\nclass Component extends DCLogic {\n  state = { menu:false, ph:0, wtd:0 };\n  componentDidMount() {\n    const root = document.documentElement; root.classList.add('js');\n    let t = this.props.theme ?? 'auto';\n    if (t === 'auto') { try { t = localStorage.getItem('solva-theme') || 'auto'; } catch (e) {} }\n    if (t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);\n    this.calme = matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const scan = () => {\n      const vh = window.innerHeight || 800;\n      const left = document.querySelectorAll('[data-rv]:not([data-in]),[data-rvs]:not([data-in])');\n      left.forEach(el => { const r = el.getBoundingClientRect(); if (r.top < vh * 0.92 && r.bottom > -40) el.setAttribute('data-in', ''); });\n      if (!left.length) { clearInterval(this.rvT); window.removeEventListener('scroll', scan); }\n    };\n    this.rvScan = scan; scan(); this.rvT = setInterval(scan, 180); window.addEventListener('scroll', scan, { passive:true });\n    this.rvFs = setTimeout(() => { if (!document.querySelector('[data-in]')) document.querySelectorAll('[data-rv],[data-rvs]').forEach(el => el.setAttribute('data-in', '')); }, 2500);\n    if (this.calme) { this.setState({ ph:4, wtd:20220 }); return; }\n    this.tick = setInterval(() => { if (document.hidden) return; this.setState(s => { const ph = s.ph >= 5 ? 0 : s.ph + 1; return { ph, wtd:ph === 0 ? 0 : ph < 3 ? 18420 : 20220 }; }); }, 2400);\n  }\n  componentWillUnmount() { clearInterval(this.tick); clearInterval(this.rvT); clearTimeout(this.rvFs); window.removeEventListener('scroll', this.rvScan); }\n  toggleTheme = () => { const r = document.documentElement; const cur = r.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); const next = cur === 'dark' ? 'light' : 'dark'; r.setAttribute('data-theme', next); try { localStorage.setItem('solva-theme', next); } catch (e) {} this.forceUpdate(); };\n  renderVals() {\n    const { menu, ph, wtd } = this.state;\n    const email = this.props.contactEmail || '', booking = this.props.bookingUrl || '';\n    const ctaHref = booking || (email ? 'mailto:' + email + '?subject=' + encodeURIComponent('Custom software — book a call') : '#talk');\n    const loaded = ph >= 1;\n    const stats = [['Jobs today', '7', 'var(--ink)'], ['Crew out', '3', 'var(--ink)'], ['Overnight', '4', 'var(--co)'], ['This week', '$' + wtd.toLocaleString('en-AU'), ph >= 3 ? 'var(--ok)' : 'var(--ink)']]\n      .map(([k, v, color], i) => ({ k, v:loaded ? v : '—', color, op:loaded ? 1 : .35, bg:i === 2 && loaded ? 'var(--co-soft)' : 'var(--sunk)' }));\n    const jobs = JOBS.map(([t, k, d, pill, c], i) => {\n      const flip = i === 2 && ph >= 2; const p = flip ? 'Booked' : pill; const cc = flip ? 'ok' : c;\n      return { t, k, d:flip ? 'J. Hinds · accepted 6:41am · Thu 8:00' : d, pill:p, pillBg:PILL[cc][0], pillFg:PILL[cc][1], op:loaded ? 1 : 0, tr:loaded ? 'none' : 'translateY(12px)', delay:(i * 120) + 'ms', bg:flip && ph === 2 ? 'var(--co-soft)' : 'transparent' };\n    });\n    return {\n      geoMeta:GEO.meta, geoFooter:GEO.footer, ctaHref, contactPending:!booking && !email,\n      menu, menuLabel:menu ? 'Close' : 'Menu', toggleMenu:() => this.setState(s => ({ menu:!s.menu })), toggleTheme:this.toggleTheme,\n      stats, jobs, dashStatus:STATUS[Math.min(ph, 4)],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
